version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: aurora_finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: aurora_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: aurora_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_secure_password@postgres:5432/aurora_finance
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: aurora-super-secure-production-monitoring-key-256bits-min
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
